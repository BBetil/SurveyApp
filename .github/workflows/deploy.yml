name: GitHub Pages'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href /SurveyApp/
      # Pages yönlendirme bilmez: /ayarlar gibi doğrudan açılan adresler uygulamaya düşsün
      - run: cp dist/sorvey/browser/index.html dist/sorvey/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/sorvey/browser
      - id: deployment
        uses: actions/deploy-pages@v4
